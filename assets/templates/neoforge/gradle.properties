org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.11
neo_version={{neoVersion}}

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.11]
neo_version_range=[21.11.45,)

# Parchment 社区映射（可选；26.x 线无此块）
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Mod metadata（neoforge.mods.toml 的 ${mod_*} 展开来源；mod_id 与 @Mod 注解必须一致）
mod_id={{name}}
mod_name={{name}}
mod_version=0.1.0
mod_group_id={{pkg}}
mod_authors=YourName
mod_license=All Rights Reserved
mod_description={{name}} NeoForge mod
