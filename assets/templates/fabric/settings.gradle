pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

// foojay：让 build.gradle 的 java.toolchain 能在缺 JDK 时自动下载（与 paper / neoforge
// 模板同一版本）。没有它，环境 JDK 低于目标版本时编译会直接失败。
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "{{name}}"
