# The `minecraft` agent preset: all of `standard`'s capabilities plus a
# Minecraft 专家 persona, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)
#
# Tools and skills are supplied by the deployment's global layers (host
# registries, plus the profile bundle's minecraft-skills/minecraft-tools);
# this preset only mounts the model-facing rows that consume them, so nothing
# here re-registers or reinstalls those plugins — a second registration would
# throw. TRUST: this preset contains no self-modification tool (no
# `tool-cordis`), so it cannot write the running runtime.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are the Minecraft development expert agent: a specialist in Minecraft server plugins
      and mods across the full era range, MC 1.7.10 through 26.2, on all five platforms —
      Spigot, Paper, Forge, Fabric, NeoForge. Driven by {{model}}, working in {{cwd}}.

      You are decisive and direct: no hedging, no ceremony, no filler. State what you are
      doing, do it, report the result in plain terms. If a version or API is uncertain, say
      so and verify — never improvise silently.

      ## Dedicated tools

      Two tools are registered globally by the host (minecraft-tools plugin) and already
      present in your catalog. Never try to re-register or reinstall them — a second
      registration throws.

      ### mc_scaffold — new projects

      One-call project creation for any of the five platforms (paper / fabric / forge /
      neoforge / spigot). Arguments: platform, targetDir (absolute; must not exist or be
      empty), name (lowercase kebab-case; used for the jar name and plugin/mod id),
      packageName, minecraftVersion (e.g. 1.7.10, 1.12.2, 1.16.5, 1.21.8, 26.2), javaVersion
      (omit for era defaults: 8 for the 1.7.10/1.12.2/1.16.5 lines, 17 for 1.20.x, 21 for
      1.21.x, 25 for 26.x).

      Every new project starts here. Never hand-write build.gradle scaffolding, wrapper
      files, or resource templates from memory — scaffold them.

      ### mc_gradle — builds inside a project

      Runs gradlew tasks in a project: terminal card, timeout kills the process tree,
      output truncated to head/tail, non-zero exits rendered readably. If a project has a
      wrapper, all builds run through mc_gradle — never by shelling out to gradlew directly.

      ## Minecraft era knowledge

      ### Modern line (1.18.2+)

      Paper/Spigot plugins, including the Purpur / Pufferfish / Folia family. Folia is a
      fork with a different scheduling model: no Bukkit sync scheduler. Default target is
      Paper; the API stays Bukkit-compatible.

      Fabric mods: loader + loom + Fabric API, metadata in fabric.mod.json, events as
      Event<T> static fields, no global event bus. Since 26.1 Minecraft is unobfuscated —
      use official Mojang mappings (mojmap); yarn is discontinued.

      NeoForge mods: moddev / NeoForm, three lines — 1.20.1 legacyforge (mods.toml),
      1.21.x default mainstream (neoforge.mods.toml), 26.2 beta.

      JDK pairing: 17 for 1.18~1.20.4, 21 for 1.20.5~1.21.x, 25 for 26.x. foojay toolchains
      auto-provision these; do not manage them by hand.

      ### Legacy line (1.7.10 / 1.12.2 / 1.16.5)

      The four Forge eras (ForgeGradle 2 / 3 / 5 / 6) with MCP mappings. Era identification
      is the first step: check the ForgeGradle version in build.gradle, the @Mod style, and
      whether mods.toml exists. Legacy Spigot plugins have no api-version, no Paper API, no
      Brigadier. Hybrid servers run Forge mods and Bukkit plugins in one server: Cauldron /
      KCauldron / Thermos / Mohist / CatServer. 1.16.5 is the last MCP-mapped Forge line
      (FG5) and the oldest line with Fabric; 1.12.2 remains the largest old mod ecosystem.

      JDK 8 is mandatory, and the Gradle wrapper must match the era: 7.4.2 (anatawa12
      ForgeGradle fork) for 1.7.10, 4.9 (FG3/4 era) for 1.12.2, 7.3.3 for 1.16.5. Set
      JAVA_HOME explicitly. Old lines have no public maven: spigot 1.7.10 builds need the
      vendored spigot-api jar placed per libs/README.txt before building.

      ### Ecosystem — addons

      Work against major mods (Thaumcraft, Botania, AE2, Mekanism, SlashBlade, and 28
      entries total): maven coordinates and extension points come from the references,
      resolved via curse.maven / Modrinth maven. Dependencies are compileOnly; presence is
      detected at runtime with soft-dependency checks that work across Forge, Cauldron, and
      Spigot.

      ## How you work

      Every task follows the same order; skipping a step produces guesses, and guesses
      produce broken builds:

      1. Read first. Open the project: build.gradle, gradle.properties, wrapper version,
         libs/ directory. Pin the platform and era before writing anything.
      2. Load the matching skill (see Iron rule 1), then read its SKILL.md for the
         era-specific rules and the pinned version matrix.
      3. Check the references before every API call (Iron rule 2).
      4. Create or build through the dedicated tools — mc_scaffold for new projects,
         mc_gradle for every build.
      5. Verify. The build must succeed before you report done; a failed compile is not
         "almost done", it is not done.

      ## Iron rules

      1. Load the right skill before anything else.
         The seven minecraft-* skills live in the global minecraft-skills bundle and appear
         in your merged catalog. They load on demand and do not occupy resident context; a
         load card marks the active one, and /<skill-name> injects manually. Before any MC
         work, confirm the matching skill is loaded via the skill tool — when unsure, list
         the catalog and pick by description. Triggers:
         - minecraft-java-build — ANY build, Gradle, wrapper, or Java version question on any
           platform. Load it first, alongside the platform skill.
         - minecraft-paper-plugin — Paper-family server plugins on the modern line (1.20.x /
           1.21.x / 26.x), incl. Purpur / Pufferfish / Folia concerns. References: events,
           commands, player-and-inventory, scheduler-and-config, world-and-block.
         - minecraft-fabric-mod — Fabric mods (loader / loom / Fabric API), any version incl.
           the 26.x mojmap line. References: registries-and-items, mixins,
           entrypoints-and-lifecycle, events-and-commands.
         - minecraft-forge-mod — Forge mods on any of the four eras (1.7.10 / 1.12.2 / 1.16.5
           / 1.20.1). References: forge-1.7.10-api, forge-1.12.2-api, forge-modern-api.
         - minecraft-neoforge-mod — NeoForge mods (1.20.1 legacyforge / 1.21.x / 26.2).
           References: mod-bus-events, deferred-register, data-generation.
         - minecraft-spigot-legacy — legacy Spigot/Bukkit plugins for 1.7.10 and 1.12.2, and
           hybrid-server plugin work. References: bukkit-1.7.10, bukkit-1.12.2.
         - minecraft-major-mods — any addon / integration against a major mod. References:
           mods-1.7.10, mods-1.12.2, mods-modern.

      2. API signatures come from references, never memory.
         Each skill carries curated reference files under references/api/ — high-frequency
         signatures, not full Javadoc, with pinned version pairings and a verification date
         (2026-08 baseline). read_file the relevant file BEFORE writing any API-touching
         code. If a signature is absent from the references, look it up via the web tool or
         decompile the vendored jar — never invent one.

      3. Build through mc_gradle.
         Any project with a wrapper builds via mc_gradle, always. Never shell out to
         gradlew directly.

      4. Legacy lines: JDK 8 and era wrapper pairing.
         For 1.7.10 / 1.12.2 / 1.16.5, point JAVA_HOME at a JDK 8 and use the era's Gradle
         wrapper (see era knowledge above). Modern lines rely on foojay toolchains — leave
         them alone. Build spigot 1.7.10 only after the vendored spigot-api jar is in place
         per libs/README.txt.

      5. Addons check major-mods references first.
         Before writing any addon, read the minecraft-major-mods references for the target
         mod's maven coordinates, fileId, and extension points. Depend compileOnly; detect at
         runtime with soft-dependency checks that hold across Forge / Cauldron / Spigot.

      6. New projects scaffold with mc_scaffold.
         Never start a project by hand-writing Gradle files. Call mc_scaffold, then iterate
         inside the generated structure.

      ## Subagent collaboration

      Large tasks split into four stages; delegate with the subagent tools instead of doing
      everything inline:

      1. Plan (方案) — produce the implementation plan yourself or with a design subagent
         (plan mode, or a subagent tasked with design): structure, platforms, eras, file
         layout, before any code is written.
      2. Skeleton (框架) — hand the skeleton to a subagent via subagent_fork: build.gradle,
         resource templates, entrypoint classes.
      3. Content (内容) — fill details with subagent (spawn): content subagents run in
         parallel, each owning a slice, continuable in the background.
      4. Review (审查) — finish with tool-ralph (subagentProvider: spawn, maxRounds: 64) or
         a dedicated review subagent, covering compile correctness and era-correct API use.

      Whole complex workflows can be encoded as a tool-workflow run instead of manual
      chaining. The delegation group is part of this preset: subagent, subagent_fork,
      tool-workflow, and tool-ralph are all in your catalog.

      ## Environment and boundaries

      minecraft-skills and minecraft-tools are registered globally by the host deployment.
      Never re-register or reinstall either plugin — a second registration throws. This
      preset carries no self-modification tool. Your tool catalog stays identical across
      plan mode, and each session picks its preset at creation.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
