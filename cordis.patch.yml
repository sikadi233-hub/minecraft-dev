- insert:
    - id: minecraft-skills
      name: minecraft-dev/skills

    - id: minecraft-tools
      name: minecraft-dev/tools
      config:
        gradleTimeoutMs: 600000
        outputTailChars: 12000
        shardedArbitration: auto
        maxAuditRetries: 3
        maxCompileRounds: 3

    # ── agent preset 自动安装（v0.6.0）──────────────────────────────────────
    # `dsh plugin add` 只装 cordis 插件，不会把 preset 放进 roster 扫描的
    # $DSH_HOME/.agent-presets/。此插件在每次 dsh 启动（挂载）时自动复制
    # preset/minecraft/ 过去；目标已有 agent.cordis.yml 则跳过（不覆盖本地
    # 修改）。可用配置 autoInstallPreset: false 关闭（见 README）。
    - id: minecraft-preset
      name: minecraft-dev/preset

    # ── 四子代理协作团队（v0.5.0 起；v0.10 改用 Agent Preset 承载角色）────────
    # 4 个 tool-subagent 实例 = 4 个独立上下文的 spawn 子代理。
    #
    # dsh 0.2.1 起 `@deepseek-ai/dsh-tool-subagent` 删除了 `persona` 与
    # `toolFilter` —— 两键残留会直接抛错（"no longer supported; configure
    # persona and tool plugins in an Agent Preset and select it with
    # agentPreset"）。角色（人设 + 工具组合）因此移入 Agent Preset：
    # preset/roles.js 注册 mc-plan / mc-skeleton / mc-content / mc-verify，
    # 每行用 `agentPreset` 指向其中一个。`backgroundMode` 也一并删除（0.2.1
    # 起委派一律异步：启动即返回 id，完成时通知；人设里已写明如何回传结果）。
    #
    # 兼容性：`agentPreset` 在 ≤0.2.0 上会被静默忽略（schemastery 保留未知键，
    # 旧版 tool-subagent 也不读它），所以同一份配置在旧版本上照样挂载成功，
    # 只是子代理没有角色人设 —— 旧版本用户可直接选择对应 preset 来获得角色。
    #
    # maxDepth: 1 = 子代理自身位于 depth 1，允许首层委派；孙代（depth 2）被拒。
    # 该键在三条线（0.1.5 / 0.1.7 / 0.2.x）上都存在，故保留。

    - id: subagent-mc-plan
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_mc_plan
        agentPreset: mc-plan
        maxDepth: 1

    - id: subagent-mc-skeleton
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_mc_skeleton
        agentPreset: mc-skeleton
        maxDepth: 1

    - id: subagent-mc-content
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_mc_content
        agentPreset: mc-content
        maxDepth: 1

    - id: subagent-mc-verify
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_mc_verify
        agentPreset: mc-verify
        maxDepth: 1
